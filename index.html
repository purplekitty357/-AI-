<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인터랙티브 생물 분류 시뮬레이터</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f0f7f4;
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background-color: #1b5e20;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        main {
            max-width: 700px;
            margin: 3rem auto;
            padding: 0 1rem;
        }

        /* 퀴즈 및 결과 카드 스타일 */
        .card {
            background: white;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06);
            text-align: center;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 2rem;
            color: #2e7d32;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        button {
            padding: 1rem;
            font-size: 1.1rem;
            border: 2px solid #a5d6a7;
            border-radius: 8px;
            background-color: #f1f8e9;
            color: #2e7d32;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
        }

        button:hover {
            background-color: #2e7d32;
            color: white;
            border-color: #2e7d32;
            transform: translateY(-2px);
        }

        /* 결과 화면 스타일 */
        .hidden {
            display: none;
        }

        .result-title {
            color: #1b5e20;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }

        /* 계통수(Tree) 시각화 스타일 */
        .tree-container {
            text-align: left;
            background: #263238;
            color: #eceff1;
            padding: 1.5rem;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            margin: 2rem 0;
            overflow-x: auto;
        }

        .tree-node {
            margin-left: 20px;
            border-left: 2px dashed #4f5b62;
            padding-left: 15px;
            position: relative;
            margin-top: 5px;
        }

        .tree-node::before {
            content: "└── ";
            color: #81c784;
            position: absolute;
            left: 0;
        }

        .tree-root {
            font-weight: bold;
            color: #ffb74d;
        }

        .tree-leaf {
            color: #4fc3f7;
            font-weight: bold;
        }

        .reset-btn {
            background-color: #e0f2f1;
            color: #00796b;
            border: 2px solid #b2dfdb;
            margin-top: 1rem;
        }
        .reset-btn:hover {
            background-color: #00796b;
            border-color: #00796b;
        }
    </style>
</head>
<body>

    <header>
        <h1>🧬 스마트 생물 분류기</h1>
        <p>질문에 답하며 역·계·문·강·목·과·속·종 단계를 찾아
